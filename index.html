<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichas D&amp;D</title>
<meta name="description" content="Fichas de personaje interactivas para D&amp;D 5e (reglas 2024)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1e26" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: barra fija arriba con PG, CA y descansos; debajo, tres columnas que se apilan en móvil */
:root{
  --bg:#eceef2;--surface:#ffffff;--sunk:#f4f5f8;--ink:#1c2130;--muted:#5b6374;--line:#d6dae2;
  --accent:#952b3d;--accent-ink:#ffffff;--accent-soft:#f5e3e6;
  --good:#2b7a4b;--bad:#b3261e;--warn:#9a6a0c;--temp:#2f68ad;
  --f-display:'Alegreya SC',Georgia,'Times New Roman',serif;
  --f-body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141a;--surface:#1b1e26;--sunk:#161920;--ink:#e8eaf0;--muted:#9aa1b1;--line:#2d323e;
  --accent:#e1717f;--accent-ink:#1b0d10;--accent-soft:#3a2026;
  --good:#5fc08a;--bad:#f07a70;--warn:#e2b04c;--temp:#7fb0ee;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141a;--surface:#1b1e26;--sunk:#161920;--ink:#e8eaf0;--muted:#9aa1b1;--line:#2d323e;
  --accent:#e1717f;--accent-ink:#1b0d10;--accent-soft:#3a2026;
  --good:#5fc08a;--bad:#f07a70;--warn:#e2b04c;--temp:#7fb0ee;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:0 0 .6rem;letter-spacing:.02em;text-wrap:balance}
h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:1rem 0 .4rem;font-weight:700}
small{color:var(--muted)}

#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.2rem;padding-block:.6rem}
.who{min-width:0;flex:1 1 180px}
.nm{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:.9rem}
.vit{display:flex;gap:.5rem;align-items:stretch;flex-wrap:wrap}
.hpbox{min-width:120px;padding:.3rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.hpnum{font-size:.95rem}.hpnum b{font-size:1.5rem}.hpnum em{color:var(--temp);font-style:normal;font-weight:700;margin-left:.3rem}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:.15rem 0}
.bar i{display:block;height:100%;background:var(--good)}.bar i.low{background:var(--bad)}
.stat{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;padding:.3rem .5rem;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.stat b{font-size:1.35rem;line-height:1.1}.stat small{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
.hpbox small{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
button.stat:hover{border-color:var(--accent)}
.ctl{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:.4rem .6rem;font-size:.85rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:.2rem;overflow-x:auto}
.tabs button{border:0;background:none;padding:.5rem .8rem;border-bottom:3px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

.b{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:.45rem .75rem;font-weight:500}
.b:hover:not(:disabled){border-color:var(--accent)}
.b:disabled{opacity:.45;cursor:not-allowed}
.b.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b.good{color:var(--good)}.b.bad{color:var(--bad)}
.b.sm{padding:.2rem .5rem;font-size:.85rem}

main{padding-block:1rem 4rem}
.cols{display:grid;grid-template-columns:1fr;gap:1rem}
@media (min-width:780px){.cols{grid-template-columns:1fr 1fr}}
@media (min-width:1150px){.cols{grid-template-columns:1fr 1fr 1fr}}
.col{display:flex;flex-direction:column;gap:1rem;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem;min-width:0}

.hpctl{display:flex;gap:.4rem;flex-wrap:wrap}
.hpctl input{width:5.5rem;padding:.45rem .5rem;border:1px solid var(--line);border-radius:7px;background:var(--sunk);font-size:16px}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.35rem 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.conc{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.7rem;padding:.5rem .7rem;border-radius:8px;background:var(--accent-soft)}
.death{margin-top:.8rem;padding:.7rem;border:1px solid var(--bad);border-radius:8px}
.death .dl{font-weight:700;color:var(--bad);margin-bottom:.3rem}
.dsrow{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem}.dsrow span{width:4rem;font-size:.9rem}

.pips{display:inline-flex;gap:.35rem;flex-wrap:wrap;vertical-align:middle}
.pip{width:18px;height:18px;padding:0;border:2px solid var(--accent);background:transparent;transform:rotate(45deg) scale(.8);border-radius:2px}
.pip.full{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:.25rem .65rem;font-size:.85rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.condlist{margin:.5rem 0 0;padding-left:1.1rem;font-size:.9rem;color:var(--muted)}
.exh{display:flex;align-items:center;gap:.5rem;margin-top:.8rem;flex-wrap:wrap}
.exh button{width:2rem;height:2rem;border:1px solid var(--line);background:var(--sunk);border-radius:6px}

.abil{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.ab{border:1px solid var(--line);border-radius:9px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;padding:.4rem .2rem;gap:.15rem}
.ab .lbl{font-size:.72rem;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.ab .mod{border:0;background:none;font-size:1.6rem;font-weight:700;line-height:1;padding:.1rem .4rem;border-radius:6px}
.ab .mod:hover{background:var(--accent-soft)}
.ab .sc{font-size:.8rem;color:var(--muted)}
.ab .sv{border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:.78rem;padding:.1rem .5rem}
.ab .sv.p{border-color:var(--accent);color:var(--accent);font-weight:700}
.skill{display:grid;grid-template-columns:1.1rem 1fr auto auto;align-items:center;gap:.5rem;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:.4rem .2rem;text-align:left}
.skill:last-child{border-bottom:0}
.skill:hover{background:var(--sunk)}
.skill .dot{color:var(--muted)}.skill .dot.p{color:var(--accent)}
.skill .ak{font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.skill b{min-width:2.2rem;text-align:right}

.list .it{padding:.55rem 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.it-head{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.it-name{font-weight:700;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.meta{font-size:.85rem;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 .3rem;margin-left:.25rem;color:var(--muted)}
details>summary{cursor:pointer;color:var(--muted);font-size:.85rem;margin-top:.2rem}
details p{margin:.3rem 0 0;font-size:.92rem;white-space:pre-wrap}
.slotrow{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.35rem 0}
.spellhead{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.9rem;margin-bottom:.4rem}
.spellhead b{font-weight:700}
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem;margin-top:.6rem}
.coins label{display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.coins input{width:100%;text-align:center;padding:.35rem .2rem;border:1px solid var(--line);border-radius:6px;background:var(--sunk);font-size:16px}
textarea.notes{width:100%;min-height:7rem;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:.5rem;font-size:16px}
.log{margin:0;padding-left:1.1rem;font-size:.9rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.92rem;margin:0}

/* Editor */
.ed{display:flex;flex-direction:column;gap:1rem;max-width:980px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
.f{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.f span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.f input,.f select,.f textarea{width:100%;padding:.4rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--sunk);font-size:16px}
.f textarea{min-height:4rem}
.f.wide{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:.35rem;font-size:.9rem}
.row-ed{border:1px solid var(--line);border-radius:8px;padding:.6rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.5rem;align-items:end;background:var(--sunk)}
.row-ed .f input,.row-ed .f select,.row-ed .f textarea{background:var(--surface)}
.stack{display:flex;flex-direction:column;gap:.6rem}
.hint{font-size:.88rem;color:var(--muted);margin:.2rem 0 .6rem}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.4rem .8rem}
.skillgrid .f{flex-direction:row;align-items:center;justify-content:space-between}
.skillgrid .f select{width:auto}
.skillgrid .f span{text-transform:none;letter-spacing:0;font-size:.92rem;color:var(--ink)}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.7rem}
.charc{border:1px solid var(--line);border-radius:9px;padding:.7rem;display:flex;flex-direction:column;gap:.5rem}
.charc.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btns{display:flex;gap:.4rem;flex-wrap:wrap}
.code{width:100%;min-height:10rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:.5rem}

/* Modal y avisos */
#modal{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center;padding:1rem max(16px,env(safe-area-inset-right,0px)) calc(1rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:600px){#modal{align-items:center}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.1rem;width:100%;max-width:440px;max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:.6rem}
.sheet p{margin:0}
.sheet ul{margin:0;padding-left:1.1rem}
.opt{display:flex;justify-content:space-between;align-items:center;gap:.5rem;width:100%;text-align:left}
#toasts{position:fixed;z-index:15;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));left:auto;display:flex;flex-direction:column;gap:.5rem;width:min(340px,calc(100vw - 24px))}
.toast{position:relative;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:9px;padding:.6rem 2rem .7rem .8rem;box-shadow:0 6px 22px rgb(0 0 0 / .18)}
.toast .x{position:absolute;top:.2rem;right:.3rem;border:0;background:none;font-size:1.2rem;color:var(--muted)}
.t-label{font-size:.82rem;color:var(--muted)}
.t-total{font-size:2rem;font-weight:700;line-height:1.1}
.t-total.crit{color:var(--good)}.t-total.fumble{color:var(--bad)}
.t-parts{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.t-actions{display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.4}}}
</style>

</head>
<body>
<header id="top"></header>
<main class="wrap" id="view"></main>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>
<button id="install-btn" class="b pri" hidden style="position:fixed;z-index:12;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px))">Instalar app</button>

<script>
const KEY='fichas-dnd-2024-v1';

const SKILLS=[['acrobatics','Acrobacias','dex'],['animal','Trato con animales','wis'],['arcana','Conocimiento arcano','int'],['athletics','Atletismo','str'],['deception','Engaño','cha'],['history','Historia','int'],['insight','Perspicacia','wis'],['intimidation','Intimidación','cha'],['investigation','Investigación','int'],['medicine','Medicina','wis'],['nature','Naturaleza','int'],['perception','Percepción','wis'],['performance','Interpretación','cha'],['persuasion','Persuasión','cha'],['religion','Religión','int'],['sleight','Juego de manos','dex'],['stealth','Sigilo','dex'],['survival','Supervivencia','wis']];

const TIME={A:'Acción',BA:'Acción adicional',R:'Reacción'};

function blank(){return{
  formato:'fichas-dnd-2024/1',id:uid(),name:'Nuevo personaje',species:'',background:'',class:'',subclass:'',level:1,xp:0,

const ZYO={formato:'fichas-dnd-2024/1',name:'Zyo',species:'Tiefling',background:'Mendigo',class:'Brujo',subclass:'',level:1,xp:0,

    {level:0,name:'Prestidigitación',time:'A',range:'10 pies',desc:'Pequeños trucos mágicos: limpiar o ensuciar, encender una vela, un efecto sensorial inofensivo, enfriar o calentar algo, una marca o símbolo temporal.'},
    {level:1,name:'Represión infernal',time:'R',range:'60 pies',kind:'salvación',damage:'2d10',desc:'Reacción cuando una criatura a la vista te hace daño. Hace salvación de DES contra tu CD: 2d10 de fuego si falla, la mitad si la supera.'},
    {level:1,name:'Maleficio',time:'BA',range:'90 pies',conc:true,material:'Ojo de tritón',damage:'1d6',desc:'Concentración, hasta 1 hora. Cada vez que impactas al objetivo con un ataque le haces 1d6 necrótico extra. Elige una característica: tiene desventaja en sus pruebas de esa característica. Si el objetivo cae a 0 PG, puedes pasar el maleficio a otra criatura con una acción adicional.'}],
  features:[
    {name:'Invocación arcana: Pacto de la Espada',source:'Brujo 1',text:'Con una acción adicional invocas tu arma de pacto en la mano. Eres competente con ella, puedes usar Carisma para el ataque y el daño, y puedes hacer que su daño sea necrótico, psíquico o radiante.'},

    {name:'Dote Superviviente',source:'Dote (trasfondo Mendigo)',text:''}],

  coins:{cp:0,sp:0,ep:0,gp:27,pp:0},languages:'Común, Infernal',

let S={chars:[],active:null,tab:'play',adv:'n',log:[]};
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const x=JSON.parse(r);S.chars=(x.chars||[]).map(normalize);S.active=x.active;if(x.tab)S.tab=x.tab}}catch(e){}
  if(!S.chars.length){S.chars=[normalize(ZYO)];S.active=S.chars[0].id}
  if(!S.chars.find(c=>c.id===S.active)) S.active=S.chars[0].id}
function save(){try{localStorage.setItem(KEY,JSON.stringify({chars:S.chars,active:S.active,tab:S.tab}))}catch(e){}}
const C=()=>S.chars.find(c=>c.id===S.active);

const pb=c=>2+Math.floor((clamp(+c.level||1,1,20)-1)/4);
const M=(c,k)=>mod(c.abilities[k]);
const saveB=(c,k)=>M(c,k)+(c.saveProf.includes(k)?pb(c):0);
const skillB=(c,s)=>{const p=+c.skills[s[0]]||0;return M(c,s[2])+(p===2?2*pb(c):p===1?pb(c):0)};
const init=c=>M(c,'dex')+(+c.initiativeBonus||0);
const spMod=c=>c.spellcasting.ability?M(c,c.spellcasting.ability):null;
const spDC=c=>8+pb(c)+spMod(c);
const spAtk=c=>pb(c)+spMod(c);

/* ---------- Dados ---------- */
function rollExpr(expr,crit){
  const m=String(expr||'').toLowerCase().replace(/\s+/g,'').match(/^[0-9d+\-]+/);if(!m) return null;
  const terms=m[0].match(/[+-]?[^+-]+/g)||[];let total=0;const parts=[];
  for(const t of terms){const sign=t[0]==='-'?-1:1,body=t.replace(/^[+-]/,'');
    if(body.includes('d')){let[n,f]=body.split('d');n=+n||1;f=+f;if(!f)continue;if(crit)n*=2;
      const rs=[];for(let i=0;i<n;i++)rs.push(d(f));const s=rs.reduce((a,b)=>a+b,0);total+=sign*s;
      parts.push((parts.length?(sign<0?'− ':'+ '):(sign<0?'− ':''))+`${n}d${f} [${rs.join(', ')}]`)}
    else{const v=+body;if(!isNaN(v)){total+=sign*v;parts.push((sign<0?'− ':'+ ')+v)}}}
  return{total:Math.max(0,total),parts:parts.join(' ')}}
function toast(html,keep){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=html+'<button class="x" data-act="close-toast" aria-label="Cerrar">×</button>';
  const box=$('#toasts');box.prepend(t);while(box.children.length>3)box.lastChild.remove();
  setTimeout(()=>t.remove(),keep?25000:9000)}
function rollD20(label,bonus,extra){
  const c=C(),exh=2*(+c.exhaustion||0),a=d(20);let b=null,nat=a;
  if(S.adv!=='n'){b=d(20);nat=S.adv==='a'?Math.max(a,b):Math.min(a,b)}
  const tot=nat+bonus-exh;
  const dice=b===null?`d20 [${a}]`:`2d20 [${a}, ${b}] ${S.adv==='a'?'ventaja':'desventaja'}`;
  const cls=nat===20?' crit':nat===1?' fumble':'';
  const ex=extra?extra(nat,tot):'';
  toast(`<div class="t-label">${esc(label)}</div><div class="t-total${cls}">${tot}</div><div class="t-parts">${dice} ${sgn(bonus)}${exh?` − ${exh} agotamiento`:''}${nat===20?' · <b>¡20 natural!</b>':nat===1?' · <b>1 natural</b>':''}</div>${ex}`,!!ex);
  S.log.unshift(`${label}: ${tot}${nat===20?' (20 nat.)':nat===1?' (1 nat.)':''}`);S.log.length=Math.min(S.log.length,15);
  S.adv='n';renderTop();if(S.tab==='play')renderLog();return{tot,nat}}
function dmgBtn(expr,label,crit){return expr&&rollExpr(expr)?`<button class="b sm" data-act="dmg" data-expr="${esc(expr)}" data-label="${esc(label)}"${crit?' data-crit="1"':''}>Daño${crit?' crítico':''} (${esc(expr)})</button>`:''}

/* ---------- Conjuros ---------- */
function slotOptions(c,L){const o=[];
  if(c.pact.total>0&&c.pact.level>=L)o.push({kind:'pact',level:c.pact.level,avail:c.pact.total-c.pact.used});
  for(let l=L;l<=9;l++){const s=c.slots[l-1];if(s.total>0)o.push({kind:'slot',level:l,avail:s.total-s.used})}
  return o}
const canCast=(c,sp)=>{const L=+sp.level||0;return L===0||sp.ritual||slotOptions(c,L).some(o=>o.avail>0)};
function afterCast(sp,how){
  const c=C();let note='';
  if(sp.conc){if(c.concentration&&c.concentration!==sp.name)note=`<div class="t-parts">Dejas de concentrarte en ${esc(c.concentration)}.</div>`;c.concentration=sp.name}
  save();render();
  const i=c.spells.indexOf(sp);let acts='';
  if(sp.kind==='ataque'&&spMod(c)!==null)acts+=`<button class="b sm pri" data-act="sp-atk" data-i="${i}">Tirar ataque (${sgn(spAtk(c))})</button>`;
  else acts+=dmgBtn(sp.damage,sp.name);
  const dc=sp.kind==='salvación'&&spMod(c)!==null?`<div class="t-parts">El objetivo tira salvación contra CD <b>${spDC(c)}</b>.</div>`:'';
  toast(`<div class="t-label">Lanzas</div><div class="t-total" style="font-size:1.3rem">${esc(sp.name)}</div><div class="t-parts">${esc(how)}${sp.conc?' · requiere concentración':''}</div>${dc}${note}${acts?`<div class="t-actions">${acts}</div>`:''}`,!!acts)}
function consume(c,kind,level){if(kind==='pact')c.pact.used=Math.min(c.pact.total,c.pact.used+1);else{const s=c.slots[level-1];s.used=Math.min(s.total,s.used+1)}}
function slotLabel(o){return o.kind==='pact'?`Espacio de pacto (nivel ${o.level})`:`Espacio de nivel ${o.level}`}

/* ---------- Render ---------- */
function pips(kind,a,T,filled){let h='<span class="pips">';for(let k=0;k<T;k++)h+=`<button class="pip${k<filled?' full':''}" data-act="pip" data-kind="${kind}" data-a="${a}" data-i="${k}" aria-label="Casilla ${k+1}"></button>`;return h+'</span>'}
function renderTop(){
  const c=C(),pct=c.hp.max?clamp(c.hp.current/c.hp.max*100,0,100):0;
  const sub=[c.species,c.class&&`${c.class} ${c.level}`,c.subclass,c.background].filter(Boolean).join(' · ');
  $('#top').innerHTML=`<div class="wrap"><div class="top-in">
    <div class="who"><div class="nm">${esc(c.name||'Sin nombre')}</div><div class="sub">${esc(sub)}</div></div>
    <div class="vit">
      <div class="hpbox"><div class="hpnum"><b>${c.hp.current}</b> / ${c.hp.max}${c.hp.temp?`<em>+${c.hp.temp}</em>`:''}</div><div class="bar"><i class="${pct<=25?'low':''}" style="width:${pct}%"></i></div><small>Puntos de golpe</small></div>
      <div class="stat"><b>${c.ac}</b><small>CA</small></div>
      <button class="stat" data-act="init" title="Tirar iniciativa"><b>${sgn(init(c))}</b><small>Inic.</small></button>
      <div class="stat"><b>${Math.max(0,c.speedFt-5*(+c.exhaustion||0))}</b><small>pies</small></div>
    </div>
    <div class="ctl">
      <div class="seg" role="group" aria-label="Próxima tirada d20">${[['n','Normal'],['a','Ventaja'],['d','Desventaja']].map(([v,t])=>`<button class="${S.adv===v?'on':''}" data-act="adv" data-v="${v}">${t}</button>`).join('')}</div>
      <button class="b" data-act="short">Descanso corto</button><button class="b" data-act="long">Descanso largo</button>
    </div></div>
    <nav class="tabs">${[['play','Partida'],['edit','Editar ficha'],['chars','Personajes e importar']].map(([t,n])=>`<button class="${S.tab===t?'on':''}" data-act="tab" data-t="${t}">${n}</button>`).join('')}</nav></div>`}

function viewPlay(c){
  const p=pb(c);
  const death=c.hp.current<=0?`<div class="death"><div class="dl">A 0 PG: salvaciones contra muerte</div>
    <div class="dsrow"><span>Éxitos</span>${pips('ds',0,3,c.deathSaves.success)}</div>

  const atk=`<section class="card"><h2>Ataques</h2>${c.attacks.length?`<div class="list">${c.attacks.map((a,i)=>`<div class="it"><div class="it-head"><span class="it-name">${esc(a.name)}</span>
      <button class="b sm pri" data-act="atk" data-i="${i}">Atacar ${sgn(+a.atk||0)}</button>${dmgBtn(a.dmg,a.name)}</div>
      <div class="meta">${esc([a.dmg&&`${a.dmg} ${a.type||''}`.trim(),a.notes].filter(Boolean).join(' · '))}</div></div>`).join('')}</div>`:'<p class="empty">Sin ataques. Añádelos en «Editar ficha».</p>'}</section>`;
  const abil=`<section class="card"><h2>Características</h2><div class="abil">${ABIL.map(([k,l])=>`<div class="ab"><span class="lbl">${l}</span>
      <button class="mod" data-act="chk" data-k="${k}" title="Prueba de ${AB[k][2]}">${sgn(M(c,k))}</button><span class="sc">${c.abilities[k]}</span>
      <button class="sv ${c.saveProf.includes(k)?'p':''}" data-act="sv" data-k="${k}" title="Tirada de salvación">Salv. ${sgn(saveB(c,k))}</button></div>`).join('')}</div>
    <p class="hint" style="margin-top:.6rem">Toca un número para tirar. El selector de arriba aplica ventaja o desventaja a la siguiente tirada.</p></section>`;
  const sk=`<section class="card"><h2>Habilidades</h2>${SKILLS.map(s=>{const pv=+c.skills[s[0]]||0;return`<button class="skill" data-act="sk" data-k="${s[0]}"><span class="dot ${pv?'p':''}">${pv===2?'◆':pv?'●':'○'}</span><span>${s[1]}</span><span class="ak">${AB[s[2]][1]}</span><b>${sgn(skillB(c,s))}</b></button>`}).join('')}</section>`;
  let mag='';
  const hasSlots=c.slots.some(s=>s.total>0)||c.pact.total>0;
  if(c.spells.length||hasSlots||c.spellcasting.ability){
    const groups={};c.spells.forEach((sp,i)=>{(groups[+sp.level||0]??=[]).push([sp,i])});
    const head=spMod(c)!==null?`<div class="spellhead"><span>Aptitud: <b>${AB[c.spellcasting.ability][2]}</b></span><span>CD de salvación: <b>${spDC(c)}</b></span><span>Ataque de conjuro: <b>${sgn(spAtk(c))}</b></span></div>`:'';
    const slots=(c.pact.total>0?`<div class="slotrow"><span>Magia de pacto · nivel ${c.pact.level}</span>${pips('pact',0,c.pact.total,c.pact.total-c.pact.used)}</div>`:'')
      +c.slots.map((s,i)=>s.total>0?`<div class="slotrow"><span>Espacios de nivel ${i+1}</span>${pips('slot',i,s.total,s.total-s.used)}</div>`:'').join('');
    mag=`<section class="card"><h2>Magia</h2>${head}${slots?`<h3>Espacios de conjuro</h3>${slots}`:''}
      ${Object.keys(groups).sort((a,b)=>a-b).map(L=>`<h3>${+L===0?'Trucos (sin espacio)':`Nivel ${L}`}</h3><div class="list">${groups[L].map(([sp,i])=>{

      ${!c.spells.length?'<p class="empty">Sin conjuros. Añádelos en «Editar ficha».</p>':''}</section>`}
  const feats=`<section class="card"><h2>Rasgos y dotes</h2>${c.features.length?`<div class="list">${c.features.map((f,i)=>`<div class="it"><div class="it-head"><span class="it-name">${esc(f.name)}</span>
      ${f.uses.max>0?pips('feat',i,f.uses.max,f.uses.max-f.uses.used):''}</div>
      <div class="meta">${esc([f.source,f.uses.max>0&&f.uses.recover&&`se recupera con descanso ${f.uses.recover}`].filter(Boolean).join(' · '))}</div>

  const eq=`<section class="card"><h2>Equipo</h2>${c.equipment.length?`<div class="list">${c.equipment.map((e,i)=>`<div class="it"><div class="it-head"><span class="it-name">${esc(e.name)}</span>
      <span class="pips"><button class="b sm" data-act="qty" data-i="${i}" data-d="-1" aria-label="Gastar uno">−</button><b style="min-width:1.6rem;text-align:center">${e.qty}</b><button class="b sm" data-act="qty" data-i="${i}" data-d="1" aria-label="Añadir uno">+</button></span></div>
      ${e.notes?`<div class="meta">${esc(e.notes)}</div>`:''}</div>`).join('')}</div>`:'<p class="empty">Sin equipo.</p>'}
    <div class="coins">${[['cp','PC'],['sp','PP'],['ep','PE'],['gp','PO'],['pp','PPt']].map(([k,l])=>`<label>${l}<input id="coin-${k}" type="number" inputmode="numeric" data-path="coins.${k}" data-num="1" value="${c.coins[k]}"></label>`).join('')}</div>
    <h3>Competencias e idiomas</h3>
    <div class="kv"><span>Armaduras</span><span>${esc(c.proficiencies.armor||'—')}</span></div>
    <div class="kv"><span>Armas</span><span>${esc(c.proficiencies.weapons||'—')}</span></div>
    <div class="kv"><span>Herramientas</span><span>${esc(c.proficiencies.tools||'—')}</span></div>
    <div class="kv"><span>Idiomas</span><span>${esc(c.languages||'—')}</span></div></section>`;
  const notes=`<section class="card"><h2>Notas de la partida</h2><textarea class="notes" id="play-notes" data-path="notes" placeholder="Nombres, pistas, misiones…">${esc(c.notes)}</textarea>
    <h3>Últimas tiradas</h3><div id="log"></div></section>`;
  return`<div class="cols"><div class="col">${vit}${atk}</div><div class="col">${abil}${sk}</div><div class="col">${mag}${feats}${eq}${notes}</div></div>`}
function renderLog(){const el=$('#log');if(el)el.innerHTML=S.log.length?`<ol class="log">${S.log.slice(0,10).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p class="empty">Aún no has tirado nada.</p>'}

/* Editor */

const ta=(l,p,v,o={})=>`<label class="f ${o.w||'wide'}"><span>${l}</span><textarea id="${pid(p)}" data-path="${p}">${esc(v)}</textarea></label>`;
const chk=(l,p,v)=>`<label class="chk"><input type="checkbox" id="${pid(p)}" data-path="${p}" data-bool="1" ${v?'checked':''}> ${l}</label>`;
const del=(list,i)=>`<button class="b sm bad" data-act="del" data-list="${list}" data-i="${i}">Quitar</button>`;
function viewEdit(c){

  <section class="card"><h2>Rasgos, dotes y recursos limitados</h2><p class="hint">Si un rasgo tiene usos (p. ej. «2 veces por descanso largo»), pon los usos y cuándo se recuperan y aparecerán casillas para marcarlos.</p>

function example(){const e=blank();delete e.id;e.attacks=[NEW.attacks()];e.spells=[NEW.spells()];e.features=[NEW.features()];e.equipment=[NEW.equipment()];return e}
function prompt4Claude(){return`Convierte la ficha de personaje de D&D 5e (reglas de 2024) que te adjunto a JSON para mi app de fichas. Usa exactamente esta estructura y estas claves:
- abilities: puntuaciones (no modificadores). saveProf: claves de las salvaciones con competencia (str, dex, con, int, wis, cha).
- skills: 1 = competencia, 2 = pericia. Claves: ${SKILLS.map(s=>s[0]).join(', ')}.
- slots: 9 entradas, una por nivel de conjuro (total = espacios). Los espacios de brujo van en "pact" (level y total), no en "slots".
- spells.time: "A" acción, "BA" acción adicional, "R" reacción u otro texto. spells.kind: "ataque", "salvación" o "". damage: fórmula como "1d10". desc: resumen breve de lo que hace.
- attacks.atk: bonificador de ataque como número; dmg: fórmula como "1d6+2".
- features: rasgos de especie y clase y dotes; uses.max y uses.recover ("corto" o "largo") solo si tienen usos limitados.
- Lo que no aparezca en la ficha, déjalo con el valor por defecto. Devuelve solo el JSON.

${JSON.stringify(example(),null,2)}`}
function viewChars(c){

    <div class="btns">${x.id===S.active?'<span class="meta">En uso</span>':`<button class="b sm pri" data-act="use" data-id="${x.id}">Usar</button>`}<button class="b sm" data-act="dup" data-id="${x.id}">Duplicar</button><button class="b sm bad" data-act="delchar" data-id="${x.id}">Borrar</button></div></div>`).join('')}</div>
    <div class="btns" style="margin-top:.8rem"><button class="b" data-act="newchar">Crear personaje vacío</button></div></section>
  <section class="card"><h2>Importar ficha</h2>
    <p class="hint">Pega el JSON de una ficha (o de varias) o elige un archivo .json. Para pasar una ficha en papel: escanéala, copia las instrucciones de abajo y pásaselas a Claude junto al escaneo; pega aquí lo que te devuelva.</p>
    <div class="btns" style="margin-bottom:.6rem"><button class="b" data-act="copy-prompt">Copiar instrucciones para Claude</button><label class="b" for="imp-file">Elegir archivo .json</label><input id="imp-file" type="file" accept=".json,application/json,text/plain" hidden></div>
    <textarea class="code" id="imp-text" placeholder='{"name": "…", "class": "…", …}'></textarea>
    <div class="btns" style="margin-top:.6rem"><button class="b pri" data-act="import">Importar</button></div><p class="hint" id="imp-msg" role="status"></p></section>
  <section class="card"><h2>Exportar «${esc(c.name)}»</h2>
    <p class="hint">Copia de seguridad o para pasarla a otro dispositivo. Las fichas se guardan solo en este navegador, así que conviene copiarla de vez en cuando.</p>
    <textarea class="code" id="exp-text" readonly>${esc(JSON.stringify(c,null,2))}</textarea>
    <div class="btns" style="margin-top:.6rem"><button class="b" data-act="copy-exp">Copiar JSON</button><button class="b" data-act="copy-all">Copiar todas las fichas</button></div></section>
  </div>`}

function renderView(){const c=C();$('#view').innerHTML=S.tab==='edit'?viewEdit(c):S.tab==='chars'?viewChars(c):viewPlay(c);if(S.tab==='play')renderLog()}

/* ---------- Modales ---------- */
function openModal(h){const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${h}</div>`;m.hidden=false;const f=m.querySelector('button');f&&f.focus()}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
function shortRestModal(){const c=C(),left=c.hitDice.total-c.hitDice.spent,cm=M(c,'con');
  const rec=c.features.filter(f=>f.uses.max>0&&f.uses.recover==='corto').map(f=>f.name);
  openModal(`<h2>Descanso corto (1 hora)</h2><p>PG: <b>${c.hp.current} / ${c.hp.max}</b> · Dados de golpe: <b>${left} / ${c.hitDice.total}</b></p>
    <button class="b" data-act="hd" ${left>0&&c.hp.current<c.hp.max?'':'disabled'}>Gastar 1 dado de golpe (${esc(c.hitDice.die)} ${sgn(cm)})</button>
    <p class="hint">Al terminar se recupera:</p><ul>${c.pact.total?`<li>Espacios de magia de pacto</li>`:''}${rec.map(n=>`<li>${esc(n)}</li>`).join('')}${!c.pact.total&&!rec.length?'<li>Nada más que los PG de los dados que gastes</li>':''}</ul>
    <div class="btns"><button class="b pri" data-act="short-done">Terminar descanso</button><button class="b" data-act="close-modal">Cancelar</button></div>`)}

/* ---------- Acciones ---------- */
const A={
  tab:el=>{S.tab=el.dataset.t;save();render();scrollTo(0,0)},
  adv:el=>{S.adv=el.dataset.v;renderTop()},
  'close-toast':el=>el.closest('.toast').remove(),
  'close-modal':closeModal,
  init:()=>rollD20('Iniciativa',init(C())),
  chk:el=>rollD20(`Prueba de ${AB[el.dataset.k][2]}`,M(C(),el.dataset.k)),
  sv:el=>rollD20(`Salvación de ${AB[el.dataset.k][2]}`,saveB(C(),el.dataset.k)),
  sk:el=>{const s=SKILLS.find(x=>x[0]===el.dataset.k);rollD20(s[1],skillB(C(),s))},
  atk:el=>{const a=C().attacks[+el.dataset.i];rollD20(`Ataque · ${a.name}`,+a.atk||0,nat=>{const b=dmgBtn(a.dmg,a.name,nat===20);return b?`<div class="t-actions">${b}</div>`:''})},
  'sp-atk':el=>{const c=C(),sp=c.spells[+el.dataset.i];rollD20(`Ataque de conjuro · ${sp.name}`,spAtk(c),nat=>{const b=dmgBtn(sp.damage,sp.name,nat===20);return b?`<div class="t-actions">${b}</div>`:''})},
  dmg:el=>{const r=rollExpr(el.dataset.expr,!!el.dataset.crit);if(!r)return;toast(`<div class="t-label">Daño${el.dataset.crit?' crítico':''} · ${esc(el.dataset.label)}</div><div class="t-total">${r.total}</div><div class="t-parts">${esc(r.parts)}</div>`);S.log.unshift(`Daño ${el.dataset.label}: ${r.total}`);if(S.tab==='play')renderLog()},
  pip:el=>{const c=C(),k=+el.dataset.i,kind=el.dataset.kind,a=+el.dataset.a;
    const nf=(filled)=>k<filled?k:k+1;
    if(kind==='ds'||kind==='df'){const key=kind==='ds'?'success':'fail';c.deathSaves[key]=clamp(nf(c.deathSaves[key]),0,3)}
    else{const o=kind==='slot'?c.slots[a]:kind==='pact'?c.pact:c.features[a].uses;const T=kind==='feat'?o.max:o.total;o.used=clamp(T-nf(T-o.used),0,T)}
    save();render()},
  cast:el=>{const c=C(),sp=c.spells[+el.dataset.i],L=+sp.level||0;
    if(L===0)return afterCast(sp,'Truco: no gasta espacio');
    const opts=slotOptions(c,L),usable=opts.filter(o=>o.avail>0);
    if(!sp.ritual&&usable.length===1){consume(c,usable[0].kind,usable[0].level);const o=usable[0];return afterCast(sp,`${slotLabel(o)} · te quedan ${o.avail-1}`)}
    openModal(`<h2>Lanzar ${esc(sp.name)}</h2><p class="hint">Elige con qué espacio. Con uno de nivel superior algunos conjuros son más potentes.</p>
      ${opts.map(o=>`<button class="b opt" data-act="cast-with" data-i="${el.dataset.i}" data-kind="${o.kind}" data-level="${o.level}" ${o.avail>0?'':'disabled'}><span>${slotLabel(o)}</span><small>quedan ${o.avail}</small></button>`).join('')}
      ${sp.ritual?`<button class="b opt" data-act="cast-with" data-i="${el.dataset.i}" data-kind="ritual"><span>Como ritual</span><small>+10 min, sin espacio</small></button>`:''}
      <button class="b" data-act="close-modal">Cancelar</button>`)},
  'cast-with':el=>{const c=C(),sp=c.spells[+el.dataset.i];closeModal();
    if(el.dataset.kind==='ritual')return afterCast(sp,'Como ritual: sin espacio');
    consume(c,el.dataset.kind,+el.dataset.level);
    const o=slotOptions(c,+sp.level).find(x=>x.kind===el.dataset.kind&&x.level===+el.dataset.level);
    afterCast(sp,`${slotLabel({kind:el.dataset.kind,level:+el.dataset.level})} · te quedan ${o?o.avail:0}`)},
  'end-conc':()=>{C().concentration='';save();render()},
  insp:()=>{const c=C();c.inspiration=!c.inspiration;save();render()},
  cond:el=>{const c=C(),n=el.dataset.n,i=c.conditions.indexOf(n);i>=0?c.conditions.splice(i,1):c.conditions.push(n);save();render()},
  exh:el=>{const c=C();c.exhaustion=clamp((+c.exhaustion||0)+(+el.dataset.d),0,6);save();render()},
  qty:el=>{const e=C().equipment[+el.dataset.i];e.qty=Math.max(0,(+e.qty||0)+(+el.dataset.d));save();render()},
  hp:el=>{const c=C(),n=Math.max(0,parseInt($('#hpAmt').value)||0);if(!n){$('#hpAmt').focus();return}
    const m=el.dataset.m;
    if(m==='heal'){const was=c.hp.current;c.hp.current=Math.min(c.hp.max,c.hp.current+n);if(was<=0&&c.hp.current>0)c.deathSaves={success:0,fail:0};toast(`<div class="t-label">Curación</div><div class="t-total">+${c.hp.current-was}</div><div class="t-parts">PG: ${c.hp.current} / ${c.hp.max}</div>`)}
    else if(m==='temp'){c.hp.temp=Math.max(c.hp.temp,n);toast(`<div class="t-label">PG temporales</div><div class="t-total">${c.hp.temp}</div><div class="t-parts">No se suman: te quedas con el valor más alto.</div>`)}
    else{let rest=n;const fromTemp=Math.min(c.hp.temp,rest);c.hp.temp-=fromTemp;rest-=fromTemp;
      const was=c.hp.current;let extra='';
      if(was<=0&&rest>0){c.deathSaves.fail=Math.min(3,c.deathSaves.fail+1);extra='<div class="t-parts">Recibir daño a 0 PG cuenta como un fallo de salvación contra muerte (dos si es crítico).</div>'}
      c.hp.current=Math.max(0,was-rest);
      if(was>0&&c.hp.current===0){extra=rest-was>=c.hp.max?'<div class="t-parts"><b>Muerte instantánea:</b> el daño sobrante iguala o supera tus PG máximos.</div>':'<div class="t-parts"><b>Caes inconsciente.</b> En tus turnos tira salvaciones contra muerte.</div>';if(!c.conditions.includes('Inconsciente'))c.conditions.push('Inconsciente')}
      let acts='';if(c.concentration&&n>0){const dc=Math.min(30,Math.max(10,Math.floor(n/2)));acts=`<div class="t-parts">Estás concentrado en ${esc(c.concentration)}: salvación de CON CD ${dc}.</div><div class="t-actions"><button class="b sm pri" data-act="conc-save" data-dc="${dc}">Tirar salvación de CON</button></div>`}
      toast(`<div class="t-label">Daño recibido</div><div class="t-total fumble">−${n}</div><div class="t-parts">${fromTemp?`${fromTemp} absorbidos por PG temporales · `:''}PG: ${c.hp.current} / ${c.hp.max}</div>${extra}${acts}`,!!acts)}
    $('#hpAmt').value='';save();render()},
  'conc-save':el=>{const c=C(),dc=+el.dataset.dc;el.closest('.toast').remove();rollD20(`Concentración (CD ${dc})`,saveB(c,'con'),(nat,tot)=>tot>=dc?'<div class="t-parts"><b>Mantienes la concentración.</b></div>':`<div class="t-parts"><b>Pierdes la concentración.</b></div>`);if(true){/* aplicar resultado */}},
  'death-roll':()=>{const c=C(),n=d(20);let msg;
    if(n===20){c.hp.current=1;c.deathSaves={success:0,fail:0};c.conditions=c.conditions.filter(x=>x!=='Inconsciente');msg='¡20! Recuperas 1 PG y te despiertas.'}
    else if(n===1){c.deathSaves.fail=Math.min(3,c.deathSaves.fail+2);msg='1 natural: cuenta como dos fallos.'}
    else if(n>=10){c.deathSaves.success=Math.min(3,c.deathSaves.success+1);msg='Éxito.'}
    else{c.deathSaves.fail=Math.min(3,c.deathSaves.fail+1);msg='Fallo.'}
    if(c.deathSaves.success>=3&&c.hp.current<=0)msg+=' Tres éxitos: estás estable (inconsciente, ya no tiras).';
    if(c.deathSaves.fail>=3)msg+=' Tres fallos: tu personaje muere.';
    toast(`<div class="t-label">Salvación contra muerte</div><div class="t-total${n>=10?' crit':' fumble'}">${n}</div><div class="t-parts">${msg}</div>`);S.log.unshift(`Salvación contra muerte: ${n}`);save();render()},
  short:()=>shortRestModal(),
  hd:()=>{const c=C(),f=+String(c.hitDice.die).replace(/\D/g,'')||8,r=d(f),cm=M(c,'con'),heal=Math.max(0,r+cm),was=c.hp.current;
    c.hitDice.spent=Math.min(c.hitDice.total,c.hitDice.spent+1);c.hp.current=Math.min(c.hp.max,c.hp.current+heal);
    toast(`<div class="t-label">Dado de golpe</div><div class="t-total">+${c.hp.current-was}</div><div class="t-parts">${esc(c.hitDice.die)} [${r}] ${sgn(cm)} CON</div>`);save();renderTop();shortRestModal()},
  'short-done':()=>{const c=C();c.pact.used=0;c.features.forEach(f=>{if(f.uses.recover==='corto')f.uses.used=0});closeModal();save();render();toast('<div class="t-label">Descanso corto terminado</div><div class="t-parts">Recursos de descanso corto recuperados.</div>')},
  long:()=>openModal(`<h2>Descanso largo (8 horas)</h2><ul><li>Recuperas todos los PG y todos los dados de golpe</li><li>Recuperas todos los espacios de conjuro</li><li>Se recuperan los rasgos con usos limitados</li><li>Agotamiento −1 y pierdes los PG temporales</li></ul>
    <div class="btns"><button class="b pri" data-act="long-done">Hacer descanso largo</button><button class="b" data-act="close-modal">Cancelar</button></div>`),
  'long-done':()=>{const c=C();c.hp.current=c.hp.max;c.hp.temp=0;c.hitDice.spent=0;c.slots.forEach(s=>s.used=0);c.pact.used=0;
    c.features.forEach(f=>{if(f.uses.recover)f.uses.used=0});c.exhaustion=Math.max(0,(+c.exhaustion||0)-1);c.deathSaves={success:0,fail:0};c.concentration='';
    c.conditions=c.conditions.filter(x=>x!=='Inconsciente');closeModal();save();render();toast('<div class="t-label">Descanso largo terminado</div><div class="t-parts">Como nuevo.</div>')},
  'tog-save':el=>{const c=C(),k=el.dataset.k,i=c.saveProf.indexOf(k);i>=0?c.saveProf.splice(i,1):c.saveProf.push(k);save();render()},
  add:el=>{C()[el.dataset.list].push(NEW[el.dataset.list]());save();renderView();const rows=document.querySelectorAll('.row-ed');const nm=[...document.querySelectorAll(`[data-path^="${el.dataset.list}."]`)].pop();nm&&nm.closest('.row-ed').querySelector('input').focus()},
  del:el=>{C()[el.dataset.list].splice(+el.dataset.i,1);save();renderView()},
  autofill:()=>{const c=C(),lvl=c.level,s=(c.class||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    const type=/brujo|warlock/.test(s)?'pact':/bard|cleri|druid|hechicer|sorcer|mago|wizard/.test(s)?'full':/paladin|explorador|ranger/.test(s)?'half':'';
    const die=/barbar/.test(s)?'d12':/guerrer|fighter|paladin|explorador|ranger/.test(s)?'d10':/hechicer|sorcer|mago|wizard/.test(s)?'d6':'d8';
    c.hitDice.die=die;c.hitDice.total=lvl;c.hitDice.spent=Math.min(c.hitDice.spent,lvl);
    c.slots.forEach(x=>{x.total=0;x.used=0});c.pact={level:0,total:0,used:0};
    if(type==='full'||type==='half'){const row=FULL[(type==='full'?lvl:Math.ceil(lvl/2))-1];row.forEach((n,i)=>c.slots[i].total=n)}
    if(type==='pact')c.pact={level:Math.min(5,Math.ceil(lvl/2)),total:lvl===1?1:lvl<11?2:lvl<17?3:4,used:0};
    if(!c.spellcasting.ability&&type){c.spellcasting.ability=/cleri|druid|explorador|ranger/.test(s)?'wis':/mago|wizard/.test(s)?'int':'cha'}
    save();renderView();renderTop();toast(`<div class="t-label">Calculado para ${esc(c.class||'sin clase')} ${lvl}</div><div class="t-parts">Dado de golpe ${die} ×${lvl}${type?'; espacios de conjuro actualizados':'; esta clase no lanza conjuros a este nivel'}.</div>`)},
  use:el=>{S.active=el.dataset.id;S.tab='play';save();render()},
  dup:el=>{const o=S.chars.find(x=>x.id===el.dataset.id),n=normalize(JSON.parse(JSON.stringify(o)));n.id=uid();n.name+=' (copia)';S.chars.push(n);save();renderView()},
  delchar:el=>{const o=S.chars.find(x=>x.id===el.dataset.id);openModal(`<h2>¿Borrar a ${esc(o.name)}?</h2><p>No se puede deshacer. Si quieres conservarla, copia antes su JSON.</p><div class="btns"><button class="b" data-act="close-modal">Cancelar</button><button class="b bad" data-act="delchar-ok" data-id="${o.id}">Borrar</button></div>`)},
  'delchar-ok':el=>{S.chars=S.chars.filter(x=>x.id!==el.dataset.id);if(!S.chars.length)S.chars=[normalize(blank())];if(!C())S.active=S.chars[0].id;closeModal();save();render()},
  newchar:()=>{const n=normalize(blank());S.chars.push(n);S.active=n.id;S.tab='edit';save();render()},
  import:()=>{const t=$('#imp-text').value.trim(),msg=$('#imp-msg');if(!t){msg.textContent='Pega primero el JSON de la ficha.';return}
    let data;try{data=JSON.parse(t.replace(/^```(json)?|```$/g,'').trim())}catch(e){msg.textContent='Ese texto no es JSON válido. Revisa que esté completo, de la primera { a la última }.';return}
    const arr=Array.isArray(data)?data:Array.isArray(data.chars)?data.chars:[data];let last;
    for(const x of arr){const n=normalize(x);if(S.chars.some(c=>c.id===n.id))n.id=uid();S.chars.push(n);last=n}
    S.active=last.id;S.tab='play';save();render();toast(`<div class="t-label">Importado</div><div class="t-parts">${arr.length} ficha${arr.length>1?'s':''}: ${esc(arr.map(x=>x.name||'Sin nombre').join(', '))}</div>`)},
  'copy-prompt':el=>copy(prompt4Claude(),el),
  'copy-exp':el=>copy(JSON.stringify(C(),null,2),el),
  'copy-all':el=>copy(JSON.stringify({chars:S.chars},null,2),el)};
function copy(text,btn){const old=btn.textContent;
  const ok=()=>{btn.textContent='Copiado';setTimeout(()=>btn.textContent=old,1600)};
  const fail=()=>{const t=$('#exp-text')||$('#imp-text');if(t){t.value=text;t.focus();t.select()}btn.textContent='Selecciónalo y cópialo';setTimeout(()=>btn.textContent=old,2500)};
  try{navigator.clipboard.writeText(text).then(ok,fail)}catch(e){fail()}}

document.addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el)});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.path)return;const c=C();
  let v=el.dataset.bool?el.checked:el.dataset.num?(el.value===''?0:Number(el.value)):el.value;
  const ks=el.dataset.path.split('.');let t=c;for(let i=0;i<ks.length-1;i++)t=t[ks[i]];t[ks[ks.length-1]]=v;
  if(el.dataset.path==='level')c.level=clamp(+v||1,1,20);
  save();renderTop()});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='imp-file'&&el.files&&el.files[0]){const r=new FileReader();r.onload=()=>{$('#imp-text').value=r.result;$('#imp-msg').textContent='Archivo cargado. Pulsa «Importar».'};r.readAsText(el.files[0]);return}
  if(el.dataset&&el.dataset.rr)renderView()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();if(e.key==='Enter'&&e.target.id==='hpAmt'){A.hp({dataset:{m:'dmg'}})}});

load();render();
</script>

<script>
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;const b=document.getElementById('install-btn');if(b)b.hidden=false});
window.addEventListener('appinstalled',()=>{deferredInstall=null;const b=document.getElementById('install-btn');if(b)b.hidden=true});
document.addEventListener('click',async e=>{if(e.target.id!=='install-btn'||!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;e.target.hidden=true});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
