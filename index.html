<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichas 5e</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Fichas de personaje interactivas para la 5.ª edición (reglas de 2024)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1e26" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=Pirata+One&family=Playfair+Display+SC:wght@700&family=Cinzel:wght@700&family=Uncial+Antiqua&family=Saira+Stencil+One&family=Philosopher:wght@700&family=Cinzel+Decorative:wght@700&family=IM+Fell+English+SC&family=Special+Elite&family=Metamorphous&family=Grenze+Gotisch:wght@600&family=Marcellus+SC&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="themes.css">
</head>
<body>
<div id="deco" aria-hidden="true"><i class="d-glow"></i><i class="d-tile"></i><i class="d-c1"></i><i class="d-c2"></i></div>
<header id="top"></header>
<main class="wrap" id="view"></main>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>
<button id="install-btn" class="b pri" hidden style="position:fixed;z-index:12;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px))">Instalar app</button>
<script src="data/classes.js"></script>
<script src="data/spells.js"></script>
<script src="data/origins.js"></script>
<script src="data/glossary.js"></script>
<script src="data/creatures.js"></script>
<script src="data/items.js"></script>
<script src="data/beasts.js"></script>
<script src="app.js"></script>
<script>
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;const b=document.getElementById('install-btn');if(b)b.hidden=false});
window.addEventListener('appinstalled',()=>{deferredInstall=null;const b=document.getElementById('install-btn');if(b)b.hidden=true});
document.addEventListener('click',async e=>{if(e.target.id!=='install-btn'||!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;e.target.hidden=true});
if('serviceWorker' in navigator){
  const hadController=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&!reloaded){reloaded=true;location.reload()}});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})})}).catch(()=>{}))}
</script>
</body>
</html>
